name: JetBrains spikes

on:
  push:
    paths:
      - 'jetbrains/spikes/**'
      - '.github/workflows/jetbrains-spikes.yml'
  workflow_dispatch:

jobs:
  spike-s1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node esbuild.js
      - run: node jetbrains/spikes/core/check.mjs
      - run: node jetbrains/spikes/core/reply.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
      - run: gradle -p jetbrains/spikes test :ide:buildPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-results-${{ matrix.os }}
          path: jetbrains/spikes/build/s1-results.json
          if-no-files-found: warn
  spike-ide:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node esbuild.js
      - run: node jetbrains/spikes/core/check.mjs
      - run: node jetbrains/spikes/core/reply.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow the JCEF sandbox (Linux, AppArmor user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run the Starter probe (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a gradle -p jetbrains/spikes :ide:integrationTest
      - name: Run the Starter probe (Windows and macOS)
        if: runner.os != 'Linux'
        run: gradle -p jetbrains/spikes :ide:integrationTest
      - name: Print spike results and IDE log excerpts
        if: always()
        shell: bash
        run: |
          for f in jetbrains/spikes/ide/build/spike-out/*.json; do echo "== $f"; cat "$f"; echo; done || true
          find . -path '*ide-tests*' -name 'idea.log' -print0 | while IFS= read -r -d '' log; do
            echo "== $log"; grep -iE 'featherspec|spike|graal|truffle|polyglot|SEVERE|ERROR' "$log" | tail -n 120
          done || true
      - name: Collect IDE logs
        if: always()
        shell: bash
        run: |
          mkdir -p spike-logs
          find . -path '*ide-tests*' -name '*.log' -size -20M -exec cp --parents {} spike-logs/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-ide-${{ matrix.os }}
          path: |
            jetbrains/spikes/ide/build/spike-out/**
            spike-logs/**
          if-no-files-found: warn
