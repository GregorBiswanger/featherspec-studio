name: JetBrains spikes

on:
  push:
    paths:
      - 'jetbrains/spikes/**'
      - '.github/workflows/jetbrains-spikes.yml'
  workflow_dispatch:

jobs:
  spike-s1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node jetbrains/spikes/core/check.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
      - run: gradle -p jetbrains/spikes test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-results-${{ matrix.os }}
          path: jetbrains/spikes/build/s1-results.json
          if-no-files-found: warn
