name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run compile
      - name: Extension-host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Extension-host tests (Windows)
        if: runner.os != 'Linux'
        run: npm test
