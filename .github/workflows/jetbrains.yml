name: JetBrains

on:
  push:
    branches: [jetbrains-host, 'jetbrains-**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetbrains-${{ github.ref }}
  cancel-in-progress: true

env:
  START_COMMIT: 3bc615cfe167ac7533ec4c13347e0ed31be6fae5

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: node jetbrains/scripts/conformanceExpected.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
      - run: gradle -p jetbrains build buildPlugin verifyPluginStructure
      - name: Check the plugin.xml of the built plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          zip=$(ls jetbrains/build/distributions/*.zip)
          work=$(mktemp -d)
          unzip -q "$zip" -d "$work"
          jar=$(ls "$work"/*/lib/featherspec-studio*.jar | head -n 1)
          xml=$(unzip -p "$jar" META-INF/plugin.xml)
          echo "$xml" | grep -F 'since-build="253.29346"'
          if echo "$xml" | grep -F 'until-build'; then
            echo "until-build must not be set" >&2
            exit 1
          fi
          test "$(echo "$xml" | grep -c '<depends>')" -eq 2
          echo "$xml" | grep -F '<depends>com.intellij.modules.platform</depends>'
          echo "$xml" | grep -F '<depends>com.intellij.modules.jcef</depends>'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: plugin-zip
          path: jetbrains/build/distributions/*.zip
          if-no-files-found: error
  vscode-mirror:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src --max-warnings 0
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p src/webview
      - run: npm run test:unit
      - run: npm run compile
      - name: Extension-host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Extension-host tests (Windows)
        if: runner.os != 'Linux'
        run: npm test
      - name: Keep the VS Code logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-logs-${{ matrix.os }}
          path: .vscode-test/user-data/logs
          if-no-files-found: ignore
          retention-days: 3
  vscode-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test 'jetbrains/guards/*.test.mjs'
      - run: npm run package
      - run: node jetbrains/guards/vsixFiles.mjs
      - run: node jetbrains/guards/vsixFiles.mjs --self-test
      - run: git diff --exit-code $START_COMMIT -- .github/workflows/ci.yml .github/workflows/publish.yml
      - name: Find the changed paths of this push
        id: changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed.txt"
          git diff --name-only "$BEFORE" "$SHA" > "$changed"
          cat "$changed"
          if node --input-type=module -e "import { readFileSync } from 'node:fs'; import { isJetBrainsOnly } from './jetbrains/guards/sameBundles.mjs'; process.exit(isJetBrainsOnly(readFileSync(process.argv[1], 'utf8').split('\n').filter(Boolean)) ? 0 : 1)" "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.changed.outputs.run == 'true'
        with:
          ref: ${{ github.event.before }}
          path: base
          fetch-depth: 0
      - name: Build the VS Code bundles of the parent commit
        if: steps.changed.outputs.run == 'true'
        working-directory: base
        run: npm ci && npm run package
      - name: Compare the VS Code bundles with the parent commit
        if: steps.changed.outputs.run == 'true'
        run: node jetbrains/guards/sameBundles.mjs base .
  shared-guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the start commit outside the workspace
        shell: bash
        run: git worktree add --detach "${{ runner.temp }}/start" "${{ env.START_COMMIT }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git diff --exit-code ${{ env.START_COMMIT }} -- src/core test/fixtures/next-step-baseline test/fixtures/read-baseline src/core/setup/mergePrompt.golden.txt .github/workflows/ci.yml .github/workflows/publish.yml
      - run: npm ci
        working-directory: ${{ runner.temp }}/start
      - run: npm ci
      - run: npm run package
        working-directory: ${{ runner.temp }}/start
      - run: npm run package
      - run: node jetbrains/guards/sharedGuard.mjs "${{ runner.temp }}/start" .
      - run: node jetbrains/guards/renderedTexts.mjs "${{ runner.temp }}/start" .
  ide-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nojcef: [none]
        include:
          - os: ubuntu-latest
            nojcef: unsupported
          - os: ubuntu-latest
            nojcef: suspended
    name: ide-tests (${{ matrix.os }}${{ matrix.nojcef != 'none' && format(', no JCEF {0}', matrix.nojcef) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: node jetbrains/scripts/conformanceExpected.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow the JCEF sandbox (Linux, AppArmor user namespaces)
        if: runner.os == 'Linux' && matrix.nojcef != 'suspended'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run the Starter tests (Linux)
        if: runner.os == 'Linux' && matrix.nojcef == 'none'
        run: xvfb-run -a gradle -p jetbrains integrationTest
      - name: Run the no-JCEF Starter test (Linux)
        if: matrix.nojcef != 'none'
        run: xvfb-run -a gradle -p jetbrains integrationTest --tests '*NoJcefIdeTest' -Pfeatherspec.nojcef=${{ matrix.nojcef }}
      - name: Run the Starter tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: gradle -p jetbrains integrationTest
      - name: Compare the JVM next steps with the Baseline
        if: always() && hashFiles('jetbrains/build/probe-out/actual/*.json') != ''
        shell: bash
        env:
          FEATHERSPEC_JVM_ACTUAL: ${{ github.workspace }}/jetbrains/build/probe-out/actual
        run: npx vitest run --project node src/hosts/embedded/jvmNextBaseline.test.ts
      - name: Print the probe results and IDE log excerpts
        if: always()
        shell: bash
        run: |
          for f in jetbrains/build/probe-out/*.json jetbrains/build/probe-out/*.txt jetbrains/build/probe-out-setup/*.json jetbrains/build/probe-out-setup/*.txt jetbrains/build/probe-out-nojcef-*/*.json jetbrains/build/probe-out-nojcef-*/*.txt; do echo "== $f"; cat "$f"; echo; done || true
          find . -path '*ide-tests*' -name 'idea.log' -print0 | while IFS= read -r -d '' log; do
            echo "== $log"; grep -iE 'featherspec|SEVERE|ERROR' "$log" | tail -n 120
          done || true
      - name: Collect IDE logs
        if: always()
        shell: bash
        run: |
          mkdir -p ide-logs
          find . -path '*ide-tests*' -name '*.log' -size -20M -exec cp --parents {} ide-logs/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-tests-${{ matrix.os }}-${{ matrix.nojcef }}
          path: |
            jetbrains/build/probe-out/**
            jetbrains/build/probe-out-setup/**
            jetbrains/build/probe-out-nojcef-*/**
            ide-logs/**
          if-no-files-found: warn
