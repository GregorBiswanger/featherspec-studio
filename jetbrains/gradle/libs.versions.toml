[versions]
kotlin = "2.4.21"
intellij-platform = "2.20.1"
junit-jupiter = "5.13.4"
junit-platform = "1.13.4"
junit4 = "4.13.2"
kodein = "7.20.2"
coroutines = "1.10.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kodein-di = { module = "org.kodein.di:kodein-di-jvm", version.ref = "kodein" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
